# Publicação no Render (https://render.com): New → Blueprint → escolher este repositório.
databases:
  - name: sweet-indulgence-db
    plan: free
    databaseName: sweet_indulgence
    user: sweet_indulgence

services:
  - type: web
    name: sweet-indulgence-cupcakes
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sweet-indulgence-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "0" # plano gratuito: um processo só, para caber na memória
