{% extends "base.html" %}
{% block titulo %}Entrar · Sweet Indulgence{% endblock %}
{% block conteudo %}
<form class="card" method="post" style="max-width:420px;margin:0 auto">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h1>Entrar</h1>
  <label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email">
  <label for="senha">Senha</label><input id="senha" name="senha" type="password" required autocomplete="current-password">
  <button class="btn bloco" style="margin-top:16px">Entrar</button>
  <p style="text-align:center">Ainda não tem conta? <a href="{{ url_for('auth.cadastrar', proximo=request.args.get('proximo')) }}">Cadastre-se</a></p>
  <details class="ajuda"><summary>Contas de demonstração</summary>
    <p>cliente@sweetindulgence.com · admin@sweetindulgence.com · entregador@sweetindulgence.com — senha <code>cupcake123</code></p>
  </details>
</form>
{% endblock %}
