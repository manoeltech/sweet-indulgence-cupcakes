{% extends "base.html" %}
{% block titulo %}Criar conta · Sweet Indulgence{% endblock %}
{% block conteudo %}
<form class="card" method="post" style="max-width:460px;margin:0 auto">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <h1>Criar conta</h1>
  <label for="nome">Nome</label><input id="nome" name="nome" value="{{ dados.get('nome', '') }}" required autocomplete="name">
  <label for="email">E-mail</label><input id="email" name="email" type="email" value="{{ dados.get('email', '') }}" required autocomplete="email">
  <label for="telefone">Celular (para o entregador falar com você)</label><input id="telefone" name="telefone" value="{{ dados.get('telefone', '') }}" inputmode="tel" placeholder="(83) 99999-9999">
  <label for="senha">Senha (mínimo 6 caracteres)</label><input id="senha" name="senha" type="password" required minlength="6" autocomplete="new-password">
  <label for="confirmacao">Confirme a senha</label><input id="confirmacao" name="confirmacao" type="password" required autocomplete="new-password">
  <button class="btn bloco" style="margin-top:16px">Criar conta</button>
  <p style="text-align:center">Já tem conta? <a href="{{ url_for('auth.entrar') }}">Entrar</a></p>
</form>
{% endblock %}
