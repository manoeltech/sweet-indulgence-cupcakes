{% extends "base.html" %}
{% block titulo %}{{ 'Editar' if cupcake.id else 'Novo' }} cupcake · Sweet Indulgence{% endblock %}
{% block conteudo %}
{% include "admin/_nav.html" %}
<h1>{{ 'Editar ' ~ cupcake.nome if cupcake.id else 'Novo cupcake' }}</h1>
<form method="post" class="card" style="max-width:720px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="nome">Nome</label><input id="nome" name="nome" value="{{ cupcake.nome or '' }}">
  <label for="categoria_id">Categoria</label>
  <select id="categoria_id" name="categoria_id"><option value="">Selecione…</option>{% for cat in categorias %}<option value="{{ cat.id }}" {{ 'selected' if cupcake.categoria_id == cat.id }}>{{ cat.nome }}</option>{% endfor %}</select>
  <label for="descricao">Descrição</label><textarea id="descricao" name="descricao" rows="3">{{ cupcake.descricao or '' }}</textarea>
  <label for="ingredientes">Ingredientes</label><textarea id="ingredientes" name="ingredientes" rows="2">{{ cupcake.ingredientes or '' }}</textarea>
  <div class="duas" style="grid-template-columns:repeat(3,1fr);gap:10px">
    <div><label for="preco">Preço (R$)</label><input id="preco" name="preco" inputmode="decimal" value="{{ cupcake.preco if cupcake.preco is not none else '' }}"></div>
    <div><label for="estoque">Estoque</label><input id="estoque" name="estoque" type="number" min="0" value="{{ cupcake.estoque if cupcake.estoque is not none else 0 }}"></div>
    <div><label for="estoque_minimo">Estoque mínimo</label><input id="estoque_minimo" name="estoque_minimo" type="number" min="0" value="{{ cupcake.estoque_minimo if cupcake.estoque_minimo is not none else 5 }}"></div>
    <div><label for="calorias">Calorias (kcal)</label><input id="calorias" name="calorias" type="number" min="0" value="{{ cupcake.calorias or '' }}"></div>
    <div><label for="gorduras_g">Gorduras (g)</label><input id="gorduras_g" name="gorduras_g" inputmode="decimal" value="{{ cupcake.gorduras_g or '' }}"></div>
    <div><label for="acucares_g">Açúcares (g)</label><input id="acucares_g" name="acucares_g" inputmode="decimal" value="{{ cupcake.acucares_g or '' }}"></div>
  </div>
  <label for="alergenos">Alérgenos (separados por vírgula)</label><input id="alergenos" name="alergenos" value="{{ cupcake.alergenos or '' }}" placeholder="Glúten, Lactose, Ovo">
  <label for="cor">Cor da cobertura (ilustração)</label><input id="cor" name="cor" type="color" value="{{ cupcake.cor or '#f9a8d4' }}" style="width:80px;height:44px;padding:4px">
  <p style="display:flex;gap:8px;margin-top:16px"><button class="btn">Salvar</button><a class="btn sec" href="{{ url_for('admin.produtos') }}">Cancelar</a></p>
</form>
{% endblock %}
